# Release workflow - triggers on version tags
# Verifies the refreshed latest images were built from the release commit,
# creates versioned GHCR tags, and publishes a GitHub release.
name: "Release"

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  IMAGE_NAMESPACE: ghcr.io/${{ github.repository_owner }}

jobs:
  # Create GitHub Release
  create-release:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Verify VERSION file matches tag
        run: |
          FILE_VERSION=$(cat VERSION | tr -d '[:space:]')
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          if [ "$FILE_VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: VERSION file ($FILE_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi
          echo "Version verified: $TAG_VERSION"

      - name: Verify curated release notes
        id: release_notes
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          NOTES_PATH="docs/releases/v${VERSION}.md"
          if [ ! -s "$NOTES_PATH" ]; then
            echo "Missing curated release notes: $NOTES_PATH"
            exit 1
          fi
          echo "path=$NOTES_PATH" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify latest images were built from this commit
        run: |
          EXPECTED_REVISION="$(git rev-parse HEAD)"

          docker pull --platform linux/amd64 "$IMAGE_NAMESPACE/meme_search:latest"
          APP_REVISION="$(docker image inspect "$IMAGE_NAMESPACE/meme_search:latest" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"

          docker pull --platform linux/amd64 "$IMAGE_NAMESPACE/image_to_text_generator:latest"
          GENERATOR_REVISION="$(docker image inspect "$IMAGE_NAMESPACE/image_to_text_generator:latest" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"

          if [ "$APP_REVISION" != "$EXPECTED_REVISION" ]; then
            echo "Rails image revision $APP_REVISION does not match release commit $EXPECTED_REVISION"
            exit 1
          fi

          if [ "$GENERATOR_REVISION" != "$EXPECTED_REVISION" ]; then
            echo "Generator image revision $GENERATOR_REVISION does not match release commit $EXPECTED_REVISION"
            exit 1
          fi

      - name: Create versioned Docker image tags
        run: |
          docker buildx imagetools create \
            "$IMAGE_NAMESPACE/meme_search:latest" \
            --tag "$IMAGE_NAMESPACE/meme_search:v${{ steps.get_version.outputs.version }}"
          docker buildx imagetools create \
            "$IMAGE_NAMESPACE/image_to_text_generator:latest" \
            --tag "$IMAGE_NAMESPACE/image_to_text_generator:v${{ steps.get_version.outputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Release v${{ steps.get_version.outputs.version }}
          body_path: ${{ github.workspace }}/${{ steps.release_notes.outputs.path }}
          generate_release_notes: false
          draft: false
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Releases created with GITHUB_TOKEN do not trigger release-event
      # workflows. workflow_dispatch is an explicit GitHub-supported exception.
      - name: Dispatch Discord release notification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run discord-release.yml \
            --ref "${{ github.event.repository.default_branch }}" \
            --field tag="${GITHUB_REF#refs/tags/}"
